<div class="about-container">
  <h1>About</h1>
  <div class="about-content">
    <p>このアプリケーションはSymbol SDKを使用したAngularアプリケーションです。Zone.jsを使用せずに実装されています。</p>
    <p>Symbol SDKは、Symbol/NEM2ブロックチェーンと対話するためのJavaScriptおよびTypeScriptライブラリです。</p>
    <p>このアプリケーションでは、以下の機能を提供しています：</p>
    <ul>
      <li>ウォレット管理</li>
      <li>トランザクション作成と署名</li>
      <li>ブロックチェーン情報の照会</li>
      <li>アカウント情報の取得</li>
    </ul>
    
    <div class="button-container">
      <button class="alert-button" (click)="showHelloWorldAlert()">Hello Worldアラートを表示</button>
    </div>
  </div>
</div>
